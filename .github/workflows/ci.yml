name: CI

on:
  push:
    branches: ['**']
  pull_request:

# One in-flight run per branch; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local toolchain (24.19.0 LTS).
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` also recreates the @theone/* workspace junctions, which is why
      # a fresh clone works on CI even though OneDrive loses them locally.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
