# The local Postgres 16 for Docker users: same credentials as the default URL in packages/db/src/client.ts.
# Optional when a native Postgres 16 server already listens on localhost:5432 (what the main machine runs).
services:
  db:
    image: postgres:16
    container_name: theone-postgres
    environment:
      POSTGRES_USER: theone
      POSTGRES_PASSWORD: theone
      POSTGRES_DB: theone
    ports:
      - "5432:5432"
    volumes:
      - theone_pgdata:/var/lib/postgresql/data

volumes:
  theone_pgdata:
