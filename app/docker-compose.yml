# Unused in S1 — the prototype runs embedded PGlite (Postgres 16 WASM).
# This service is the committed upgrade path: the same migrations/*.sql run
# verbatim against real Postgres 16 later; upgrade is a connection-string swap.
services:
  db:
    image: postgres:16
    container_name: theone-postgres
    environment:
      POSTGRES_USER: theone
      POSTGRES_PASSWORD: theone
      POSTGRES_DB: theone
    ports:
      - "5432:5432"
    volumes:
      - theone_pgdata:/var/lib/postgresql/data

volumes:
  theone_pgdata:
