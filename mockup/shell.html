<title>The One — Seamless FM Operations Platform</title>
<!-- INLINE:TOKENS -->
<style>
  /* ---------- App shell ---------- */
  #app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .side-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 12px;
  }
  .side-logo .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .side-logo .word { font-weight: 700; font-size: var(--fs-13); letter-spacing: .12em; }
  .side-logo .sub { font-size: var(--fs-10); color: var(--ink-3); letter-spacing: .04em; margin-top: 1px; }

  .side-group { padding: 8px 8px 2px; }
  .side-group + .side-group { margin-top: 2px; }
  .side-group .overline { padding: 6px 10px 4px; }

  .side-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    padding: 7px 10px; border-radius: var(--r-sm);
    font-size: var(--fs-13); font-weight: 500; color: var(--ink-2);
    cursor: pointer; transition: background .13s, color .13s;
    border: 0; background: none;
  }
  .side-item:hover { background: var(--surface-2); color: var(--ink); }
  .side-item.is-active { background: var(--primary-soft); color: var(--primary-ink); }
  .side-item svg { width: 16px; height: 16px; }
  .side-item .grow { flex: 1; }
  .side-item .badge { font-size: var(--fs-10); }
  .side-item.is-stub { color: var(--ink-3); }
  .side-item.is-stub:hover { color: var(--ink-2); }

  .side-foot {
    margin-top: auto; padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .side-foot .who { flex: 1; min-width: 0; }
  .side-foot .who b { display: block; font-size: var(--fs-13); font-weight: 600; }
  .side-foot .who span { font-size: var(--fs-11); color: var(--ink-3); }

  /* Main region */
  #main { display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: var(--topbar-h); flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #topbar .search { width: min(420px, 40vw); }
  #topbar .spacer { flex: 1; }
  .bell { position: relative; }
  .bell .badge {
    position: absolute; top: -2px; right: -2px;
    background: var(--danger); color: #fff;
    min-width: 15px; height: 15px; font-size: 10px; padding: 0 4px;
    border: 2px solid var(--surface);
  }

  #content { flex: 1; overflow-y: auto; position: relative; }
  .screen[hidden] { display: none !important; }

  /* Toast (stub navigation) */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(8px);
    z-index: var(--z-toast);
    background: var(--ink); color: var(--bg);
    font-size: var(--fs-12); font-weight: 500;
    padding: 8px 14px; border-radius: var(--r-full);
    box-shadow: var(--shadow-2);
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

        <span class="grow">Dispatch &amp; Team</span>

    <div class="side-foot">

  </nav>

  <div id="main">
    <header id="topbar">
      <div class="search">

    <main id="content">

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var content = document.getElementById('content');
  var sidebar = document.getElementById('sidebar');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  // screen id -> sidebar item that should light up
  var sideMap = {
    dashboard: 'dashboard',
    workorders: 'workorders',
    'workorder-detail': 'workorders',
    vendors: 'vendors',
    admin: 'admin'
  };

  function show(name) {
    var target = document.getElementById('screen-' + name);
    if (!target) return;
    var screens = content.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].hidden = true;
    target.hidden = false;
    content.scrollTop = 0;
    var items = sidebar.querySelectorAll('.side-item[data-goto]');
    for (var j = 0; j < items.length; j++) {
      items[j].classList.toggle('is-active', items[j].getAttribute('data-goto') === sideMap[name]);
    }
  }

  function note(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
  }

  document.addEventListener('click', function (e) {
    var stub = e.target.closest('[data-stub]');
    if (stub) { note(stub.getAttribute('data-stub') + ' isn’t part of this mockup yet'); return; }
    var el = e.target.closest('[data-goto]');
    if (el) show(el.getAttribute('data-goto'));
  });

  // initial state: show dashboard only
  var screens = content.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].hidden = true;
  show('dashboard');
})();
</script>
